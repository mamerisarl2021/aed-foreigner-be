openapi: 3.0.0
info:
  title: 'AED Foreigner API'
  description: 'API documentation for AED Foreigner Enrollment'
  contact:
    email: support@example.com
  license:
    name: 'Apache 2.0'
    url: 'http://www.apache.org/licenses/LICENSE-2.0.html'
  version: 1.0.0
servers:
  -
    url: /
    description: 'Relative to APP_URL (API prefix /api/v1 on routes)'
paths:
  /api/v1/admin/login:
    post:
      tags:
        - 'Admin Auth'
      summary: 'Admin/Agent Login (returns Sanctum token)'
      operationId: adminLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
              type: object
      responses:
        200:
          description: 'Login successful with access_token'
        403:
          description: 'Forbidden (Not an agent or inactive account)'
  /api/v1/admin/password/change:
    post:
      tags:
        - 'Admin Auth'
      summary: 'Change staff password (authenticated)'
      operationId: adminChangePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - current_password
                - password
                - password_confirmation
              properties:
                current_password:
                  type: string
                  format: password
                password:
                  type: string
                  format: password
                password_confirmation:
                  type: string
                  format: password
              type: object
      responses:
        200:
          description: 'Password updated'
        400:
          description: 'Current password incorrect'
      security:
        -
          sanctum: []
  '/api/v1/agents/{id}':
    post:
      tags:
        - 'Admin Auth'
      summary: 'Update Agent Details'
      operationId: updateAgent
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                name:
                  type: string
                first_name:
                  type: string
                role:
                  type: string
                  enum:
                    - AGENT
                    - RESPONSABLE_DE_VALIDATION
                    - MANAGER
                    - AUDITEUR
                phonenumber:
                  type: string
                email:
                  type: string
                  format: email
              type: object
      responses:
        200:
          description: 'Agent updated'
  /api/v1/admins/logout:
    post:
      tags:
        - 'Admin Auth'
      summary: 'Admin Logout'
      operationId: adminLogout
      responses:
        200:
          description: 'Logged out'
      security:
        -
          sanctum: []
  /api/v1/agents/register:
    post:
      tags:
        - 'Admin Auth'
      summary: 'Register New Agent'
      operationId: registerAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - name
                - first_name
                - phonenumber
                - email
                - role
              properties:
                name:
                  description: Nom
                  type: string
                first_name:
                  description: Prénoms
                  type: string
                role:
                  type: string
                  enum:
                    - AGENT
                    - RESPONSABLE_DE_VALIDATION
                    - MANAGER
                phonenumber:
                  type: string
                email:
                  type: string
                  format: email
              type: object
      responses:
        200:
          description: 'Agent registered'
  /api/v1/enrolements/etrangers:
    post:
      tags:
        - 'Enrollment - Physique'
      summary: 'Submit personne physique enrollment'
      description: 'Diagram §2.4. Requires OTP + KYC gates. Returns 202 with statut EN_ATTENTE.'
      operationId: enrollmentStoreEtranger
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              required:
                - email
                - phonenumber
                - name
                - first_name
                - nationality
              properties:
                email:
                  type: string
                  format: email
                phonenumber:
                  type: string
                name:
                  type: string
                first_name:
                  type: string
                sexe:
                  type: string
                date_of_birth:
                  type: string
                  format: date
                place_of_birth:
                  type: string
                nationality:
                  type: string
                country_of_residence:
                  type: string
                address:
                  type: string
                document_type:
                  type: string
                document_number:
                  type: string
                selfie:
                  type: string
                  format: binary
                recto:
                  type: string
                  format: binary
                verso:
                  type: string
                  format: binary
                profile:
                  type: string
                  format: binary
              type: object
      responses:
        202:
          description: 'Demande acceptée'
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    properties:
                      demande_id:
                        type: integer
                      statut:
                        type: string
                        example: EN_ATTENTE
                    type: object
                type: object
        400:
          description: 'OTP or KYC not verified'
        422:
          description: 'Validation error'
  /api/v1/enrolements:
    get:
      tags:
        - 'Enrollment - Physique'
      summary: 'List enrollment requests'
      description: 'Diagram §3.1/§3.2. Filter by statut (supports pipe: VALIDATION_AGENT|REJET_AGENT).'
      operationId: enrollmentList
      parameters:
        -
          name: statut
          in: query
          description: 'Status filter (alias: status). Default EN_ATTENTE.'
          schema:
            type: string
            example: EN_ATTENTE
        -
          name: type
          in: query
          schema:
            type: string
            enum:
              - PERSONNE_PHYSIQUE
              - PERSONNE_MORALE
        -
          name: q
          in: query
          schema:
            type: string
        -
          name: from
          in: query
          schema:
            type: string
            format: date
        -
          name: to
          in: query
          schema:
            type: string
            format: date
        -
          name: per_page
          in: query
          schema:
            type: integer
            default: 15
        -
          name: order_by
          in: query
          schema:
            type: string
            enum:
              - id
              - created_at
        -
          name: order_dir
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
      responses:
        200:
          description: 'Paginated list'
        401:
          description: Unauthenticated
        403:
          description: Forbidden
      security:
        -
          sanctum: []
  '/api/v1/enrolements/{id}':
    get:
      tags:
        - 'Enrollment - Physique'
      summary: 'Enrollment request detail (agent backoffice)'
      description: 'Use for both personne physique and personne morale agent detail views. Morale list demandeur = submitted_by user (demandeur authentifié).'
      operationId: enrollmentShow
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'Detail demande'
        404:
          description: 'Not found'
      security:
        -
          sanctum: []
  '/api/v1/enrolements/{id}/prise-en-charge':
    patch:
      tags:
        - 'Enrollment - Physique'
      summary: 'Agent self-assign (prise en charge)'
      description: 'Agent only. EN_ATTENTE and unassigned requests only.'
      operationId: enrollmentPriseEnCharge
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'Demande prise en charge'
        422:
          description: 'Already assigned or wrong status'
      security:
        -
          sanctum: []
  '/api/v1/enrolements/{id}/instruction':
    patch:
      tags:
        - 'Enrollment - Physique'
      summary: 'Agent instruction (validate or reject)'
      description: 'Diagram §3.1. From EN_ATTENTE → VALIDATION_AGENT or REJET_AGENT. Agent must have prise en charge first.'
      operationId: enrollmentInstruction
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - statut
              properties:
                statut:
                  type: string
                  enum:
                    - VALIDATION_AGENT
                    - REJET_AGENT
                motif:
                  type: array
                  items:
                    type: string
                commentaire:
                  type: string
              type: object
      responses:
        200:
          description: 'Instruction enregistrée'
        422:
          description: 'Statut non éligible'
      security:
        -
          sanctum: []
  '/api/v1/enrolements/{id}/validation':
    patch:
      tags:
        - 'Enrollment - Physique'
      summary: 'Responsable validation decision'
      description: 'Diagram §3.2. APPROUVEE triggers TrustedX register + finalisation invite.'
      operationId: enrollmentValidation
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - decision
              properties:
                decision:
                  type: string
                  enum:
                    - APPROUVEE
                    - REJET_CONFIRME
                    - RETOUR_AGENT
                commentaire:
                  type: string
              type: object
      responses:
        200:
          description: 'Décision enregistrée'
        422:
          description: 'Statut non éligible'
      security:
        -
          sanctum: []
  /api/v1/enrolements/finalisation:
    get:
      tags:
        - 'Enrollment - Physique'
      summary: 'Validate finalisation token and return UI payload'
      description: 'Diagram §4 — open link from invitation email.'
      operationId: enrollmentFinalisationShow
      parameters:
        -
          name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        200:
          description: 'Demande éligible à la finalisation'
        400:
          description: 'Token expiré'
        404:
          description: 'Token ou demande introuvable'
  '/api/v1/enrolements/{id}/finalisation':
    post:
      tags:
        - 'Enrollment - Physique'
      summary: 'Complete enrollment (password, PIN, security questions)'
      description: 'Diagram §4. TrustedX identity must already exist (APPROUVEE). Sets statut ENROLEE.'
      operationId: enrollmentFinalisationStore
      parameters:
        -
          name: id
          in: path
          description: demande_id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - token
                - password
                - pin
              properties:
                token:
                  type: string
                password:
                  type: string
                  format: password
                  minLength: 8
                pin:
                  type: string
                  minLength: 4
                  example: '1234'
                security_questions:
                  type: array
                  items:
                    properties:
                      question:
                        type: string
                      answer:
                        type: string
                    type: object
              type: object
      responses:
        200:
          description: 'Enrôlement finalisé (ENROLEE)'
        422:
          description: 'Demande non éligible'
  /api/v1/kyc/verify:
    post:
      tags:
        - 'Enrollment - KYC'
      summary: 'Sync KYC / liveness verification'
      description: 'Diagram §2.3. Requires both OTP channels verified. Stores KYC session in cache for submit.'
      operationId: enrollmentKycVerify
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              required:
                - email
                - phonenumber
              properties:
                email:
                  type: string
                  format: email
                phonenumber:
                  type: string
                liveness:
                  type: number
                  format: float
                  example: 0.95
                similarity:
                  type: number
                  format: float
                  example: 0.88
                selfie:
                  type: string
                  format: binary
                recto:
                  type: string
                  format: binary
                verso:
                  type: string
                  format: binary
              type: object
      responses:
        200:
          description: 'KYC valide'
        400:
          description: 'OTP non vérifié ou KYC échoué'
        422:
          description: 'Validation error'
  /api/v1/otp/send:
    post:
      tags:
        - 'Enrollment - OTP'
      summary: 'Send OTP to email and/or phone'
      description: 'Diagram §2.2. Publishes otp.send event and delivers via notify.email / notify.sms. Call once with both email and phonenumber, then verify each channel separately.'
      operationId: enrollmentOtpSend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                email:
                  type: string
                  format: email
                  example: etranger@example.com
                phonenumber:
                  type: string
                  example: '+22990123456'
              type: object
      responses:
        200:
          description: "OTP en cours d'envoi"
        422:
          description: 'Validation error'
  /api/v1/otp/verify:
    post:
      tags:
        - 'Enrollment - OTP'
      summary: 'Verify OTP for one channel (email or phone)'
      description: 'Call twice (email, then phonenumber) before POST /kyc/verify. Both channels must be verified.'
      operationId: enrollmentOtpVerify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - otp
              properties:
                email:
                  type: string
                  format: email
                phonenumber:
                  type: string
                otp:
                  type: string
                  example: '123456'
              type: object
      responses:
        200:
          description: 'OTP valide'
        400:
          description: 'OTP invalide ou expiré'
  /api/v1/enrolements/morales:
    post:
      tags:
        - 'Enrollment - Morale'
      summary: 'Submit personne morale enrollment'
      description: 'Requires authenticated client with finalized physique enrollment. Initial statut AWAITING_CONTACT_VERIFICATION.'
      operationId: enrollmentMoraleSubmit
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              required:
                - email
                - phonenumber
                - legal_name
                - country_of_incorporation
                - registration_number
                - headquarters_address
                - activity_sector
                - legal_representative_name
                - legal_representative_first_name
                - is_legal_representative
                - trade_register_extract
              properties:
                email:
                  type: string
                  format: email
                phonenumber:
                  type: string
                legal_name:
                  type: string
                legal_form:
                  type: string
                country_of_incorporation:
                  type: string
                registration_number:
                  type: string
                incorporation_date:
                  type: string
                  format: date
                headquarters_address:
                  type: string
                activity_sector:
                  type: string
                legal_representative_name:
                  type: string
                legal_representative_first_name:
                  type: string
                is_legal_representative:
                  type: boolean
                trade_register_extract:
                  type: string
                  format: binary
                statutes:
                  type: string
                  format: binary
                procuration:
                  type: string
                  format: binary
              type: object
      responses:
        200:
          description: 'Demande enregistrée'
        403:
          description: 'Prerequisites not met'
        409:
          description: 'Duplicate open request or company'
      security:
        -
          sanctum: []
  '/api/v1/enrolements/morales/{id}':
    get:
      tags:
        - 'Enrollment - Morale'
      summary: 'Morale enrollment detail (owner only)'
      operationId: enrollmentMoraleShow
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'Detail demande morale'
        403:
          description: 'Not owner'
      security:
        -
          sanctum: []
  '/api/v1/enrolements/morales/{id}/verify-email':
    post:
      tags:
        - 'Enrollment - Morale'
      summary: 'Verify company email (public token link)'
      operationId: enrollmentMoraleVerifyEmail
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - token
              properties:
                token:
                  type: string
              type: object
      responses:
        200:
          description: 'Email vérifié; may promote to EN_ATTENTE if phone also verified'
  '/api/v1/enrolements/morales/{id}/send-phone-otp':
    post:
      tags:
        - 'Enrollment - Morale'
      summary: 'Send SMS OTP for company phone verification'
      operationId: enrollmentMoraleSendPhoneOtp
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'OTP SMS envoyé'
      security:
        -
          sanctum: []
  '/api/v1/enrolements/morales/{id}/verify-phone-otp':
    post:
      tags:
        - 'Enrollment - Morale'
      summary: 'Verify company phone OTP'
      operationId: enrollmentMoraleVerifyPhoneOtp
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - otp
              properties:
                otp:
                  type: string
                  example: '123456'
              type: object
      responses:
        200:
          description: 'Téléphone vérifié; may promote to EN_ATTENTE'
      security:
        -
          sanctum: []
components:
  securitySchemes:
    sanctum:
      type: http
      description: 'Staff token from POST /api/v1/admin/login. Prefix: Bearer {token}'
      bearerFormat: Sanctum
      scheme: bearer
tags:
  -
    name: 'Enrollment - OTP'
    description: 'Diagram §2.2 — OTP send/verify'
  -
    name: 'Enrollment - KYC'
    description: 'Diagram §2.3 — sync KYC/liveness'
  -
    name: 'Enrollment - Physique'
    description: 'Diagram §2.4 — submit + review + finalisation'
  -
    name: 'Enrollment - Morale'
    description: 'Personne morale enrollment'
  -
    name: 'Admin Auth'
    description: 'Admin Auth'
