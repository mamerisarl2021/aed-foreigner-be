# Scanner config only. Host, token, and organization belong in CI / the Sonar UI — never here.
# Usage: sonar-scanner  (or pass -Dsonar.host.url / -Dsonar.token from the pipeline)

sonar.projectKey=aed-foreigner-be
sonar.projectName=AED Foreigner Backend
sonar.sourceEncoding=UTF-8

# Application PHP. Tests are separate so they are not counted as production code.
sonar.sources=app,bootstrap,config,database,routes
sonar.tests=tests
sonar.php.file.suffixes=php

# Noise and inherited PKI surfaces that produced false positives on the last report:
# docker/php.ini (cookie Secure), vendor, generated storage, Outlook email blades (SRI).
sonar.exclusions=\
  vendor/**,\
  node_modules/**,\
  storage/**,\
  public/**,\
  bootstrap/cache/**,\
  docker/**,\
  resources/views/emails/**,\
  txdocs/**,\
  **/*.pdf,\
  coverage.xml,\
  coverage/**

# Uncomment when the pipeline publishes PHPUnit Clover / JUnit (not generated by default):
#   php artisan test --coverage-clover=coverage.xml --log-junit=junit.xml
# sonar.php.coverage.reportPaths=coverage.xml
# sonar.php.tests.reportPath=junit.xml
