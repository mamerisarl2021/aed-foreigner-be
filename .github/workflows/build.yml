name: Build

on:
  push:
    branches:
      - 'local-dev'

jobs:

  docker_build:
    runs-on: ubuntu-latest
    container: catthehacker/ubuntu:act-latest
    # needs: build_and_analyze
    name: Continuous Integration
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: mamerisarl/aed:local
  deploy:
    runs-on: ubuntu-latest
    needs: docker_build
    name: Continuous Deployment
    steps:
      - name: Deploy using ssh
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_LOCAL_HOST }}
          username: ${{ secrets.SSH_LOCAL_USERNAME }}
          password: ${{ secrets.SSH_LOCAL_PASSWORD }}
          port: 22
          script: |
            cd /srv/aed/
            docker compose -f stagging.docker-compose.yml down
            docker system prune -f
            docker network rm api_ws_app-network || true
            docker network create api_ws_app-network
            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
            timeout 1800s docker pull mamerisarl/aed:local
            timeout 4800s docker compose -f stagging.docker-compose.yml up -d

            # Wait for the MySQL databases to be ready
            until docker exec stagging_aed_db mysqladmin ping --silent; do
              echo 'waiting for mysql to be connectable...'
              sleep 2
            done

            # Retry mechanism to ensure database connectivity and migrations run smoothly
            for i in {1..10}; do
              if docker exec stagging-aed php artisan migrate --force; then
                echo 'Migrations completed successfully'
                break
              else
                echo 'Failed to run migrations. Retrying in 5 seconds...'
                sleep 5
              fi

              if [ $i -eq 10 ]; then
                echo 'Failed to run migrations after 10 attempts. Exiting...'
                exit 1
              fi
            done

            # Wait for the second MySQL database to be ready
            until docker exec stagging_aed_db mysqladmin ping --silent; do
              echo 'waiting for mysql to be connectable...'
              sleep 2
            done
