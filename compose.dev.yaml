x-dev-php: &dev-php
  build:
    context: .
    dockerfile: ./docker/common/php-fpm/Dockerfile
    target: development
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
      XDEBUG_ENABLED: ${XDEBUG_ENABLED:-true}
      XDEBUG_MODE: develop,coverage,debug,profile
      XDEBUG_HOST: ${XDEBUG_HOST:-host.docker.internal}
      XDEBUG_IDE_KEY: ${XDEBUG_IDE_KEY:-DOCKER}
      XDEBUG_LOG: /dev/stdout
      XDEBUG_LOG_LEVEL: 0
  env_file:
    - .env.compose
  user: "${UID:-1000}:${GID:-1000}"
  userns_mode: keep-id
  volumes:
    - ./:/var/www
  networks:
    - portal-id-foreigner-development

services:
  web:
    image: nginx:latest
    container_name: portalidforeigner-nginx
    volumes:
      - ./:/var/www
      - ./docker/common/development/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      # Default 8000 so a reverse tunnel
      #   ssh -N -R 0.0.0.0:8000:127.0.0.1:8000 ubuntu@…
      # reaches Nginx. Stop `php artisan serve` on that port first.
      - "${NGINX_PORT:-8000}:80"
    environment:
      - NGINX_HOST=localhost
    networks:
      - portal-id-foreigner-development
    depends_on:
      php-fpm:
        condition: service_healthy

  php-fpm:
    <<: *dev-php
    container_name: portalidforeigner-php-fpm
    entrypoint: ["/var/www/docker/common/development/php-fpm/entrypoint.sh"]
    command: ["php-fpm"]
    environment:
      # Address Consul probes. With the reverse tunnel, that is loopback:8000
      # on the Consul host — not a Docker bridge IP.
      CONSUL_SERVICE_IP: ${CONSUL_SERVICE_IP:-127.0.0.1}
      CONSUL_SERVICE_PORT: ${CONSUL_SERVICE_PORT:-8000}
    healthcheck:
      test: ["CMD-SHELL", "php-fpm-healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  queue:
    <<: *dev-php
    container_name: portalidforeigner-queue
    entrypoint: ["/var/www/docker/common/php-fpm/queue-entrypoint.sh"]
    restart: unless-stopped
    depends_on:
      php-fpm:
        condition: service_healthy
      redis:
        condition: service_healthy

  consul-register:
    <<: *dev-php
    container_name: portalidforeigner-consul-register
    entrypoint: ["/var/www/docker/common/php-fpm/consul-register.sh"]
    restart: on-failure
    environment:
      CONSUL_SERVICE_IP: ${CONSUL_SERVICE_IP:-127.0.0.1}
      CONSUL_SERVICE_PORT: ${CONSUL_SERVICE_PORT:-8000}
    depends_on:
      php-fpm:
        condition: service_healthy
      web:
        condition: service_started

  workspace:
    build:
      context: .
      dockerfile: ./docker/common/development/workspace/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        XDEBUG_ENABLED: ${XDEBUG_ENABLED:-true}
        XDEBUG_MODE: develop,coverage,debug,profile
        XDEBUG_HOST: ${XDEBUG_HOST:-host.docker.internal}
        XDEBUG_IDE_KEY: ${XDEBUG_IDE_KEY:-DOCKER}
        XDEBUG_LOG: /dev/stdout
        XDEBUG_LOG_LEVEL: 0
    container_name: portalidforeigner-workspace
    tty: true
    stdin_open: true
    env_file:
      - .env.compose
    volumes:
      - ./:/var/www
    networks:
      - portal-id-foreigner-development

  postgres:
    image: postgres:18
    container_name: portalidforeigner-postgres
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-app}
      POSTGRES_USER: ${DB_USERNAME:-laravel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - portal-id-foreigner-development-data:/var/lib/postgresql
    networks:
      - portal-id-foreigner-development
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: portalidforeigner-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    networks:
      - portal-id-foreigner-development
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  portal-id-foreigner-development:

volumes:
  portal-id-foreigner-development-data:
