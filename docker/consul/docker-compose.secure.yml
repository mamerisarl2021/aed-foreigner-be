# =====================================================================
#  Consul DURCI (staging / production) — ACL + gossip + TLS
#  Prérequis : voir README-securisation.md
#    1. docker network create mod-id-net   (si pas déjà fait)
#    2. clé gossip renseignée dans config/consul.hcl
#    3. certificats déposés dans ./tls (ca.pem, server.pem, server-key.pem)
#  Lancement : docker compose -f docker-compose.secure.yml up -d
# =====================================================================
services:
  consul-server:
    image: hashicorp/consul:1.20
    container_name: consul-secure
    restart: unless-stopped
    command: "agent -config-dir=/consul/config"
    volumes:
      - ./config:/consul/config:ro
      - ./tls:/consul/tls:ro
      - consul-data:/consul/data
    ports:
      - "8501:8501"       # API HTTPS
      - "8600:8600/udp"   # DNS
    healthcheck:
      test: ["CMD", "consul", "info"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  consul-data:

networks:
  default:
    name: mod-id-net
    external: true
